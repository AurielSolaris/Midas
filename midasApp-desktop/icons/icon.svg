<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Midas: a film frame wearing a gold crown, cocked to the right. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173126"/>
      <stop offset="1" stop-color="#07100B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="0.35" stop-color="#F2C94C"/>
      <stop offset="0.7" stop-color="#C9961E"/>
      <stop offset="1" stop-color="#8A6212"/>
    </linearGradient>
    <linearGradient id="goldBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9B93A"/>
      <stop offset="1" stop-color="#9C6E14"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30353A"/>
      <stop offset="1" stop-color="#14171A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A2C"/>
      <stop offset="1" stop-color="#0C1A12"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Film frame, slightly tilted the other way so the crown reads as cocked -->
  <g transform="rotate(-6 256 296)">
    <rect x="92" y="156" width="328" height="268" rx="28" fill="#000" opacity="0.35" transform="translate(6 10)"/>
    <rect x="92" y="156" width="328" height="268" rx="28" fill="url(#film)" stroke="url(#gold)" stroke-width="7"/>
    <!-- Sprocket holes -->
    <g fill="#07100B">
      <rect x="108" y="180" width="26" height="22" rx="6"/>
      <rect x="108" y="222" width="26" height="22" rx="6"/>
      <rect x="108" y="264" width="26" height="22" rx="6"/>
      <rect x="108" y="306" width="26" height="22" rx="6"/>
      <rect x="108" y="348" width="26" height="22" rx="6"/>
      <rect x="108" y="390" width="26" height="14" rx="6"/>
      <rect x="378" y="180" width="26" height="22" rx="6"/>
      <rect x="378" y="222" width="26" height="22" rx="6"/>
      <rect x="378" y="264" width="26" height="22" rx="6"/>
      <rect x="378" y="306" width="26" height="22" rx="6"/>
      <rect x="378" y="348" width="26" height="22" rx="6"/>
      <rect x="378" y="390" width="26" height="14" rx="6"/>
    </g>
    <!-- The picture: a gold play mark -->
    <rect x="150" y="182" width="212" height="216" rx="16" fill="url(#screen)"/>
    <path d="M222 238 L222 342 L310 290 Z" fill="url(#gold)" stroke="#8A6212" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Crown, tilted to the right over the frame's top-right corner -->
  <g transform="translate(362 142) rotate(24)">
    <g transform="translate(5 9)" opacity="0.35">
      <path d="M-92 40 L-104 -48 L-48 2 L0 -78 L48 2 L104 -48 L92 40 Z" fill="#000"/>
      <rect x="-96" y="34" width="192" height="34" rx="9" fill="#000"/>
    </g>
    <path d="M-92 40 L-104 -48 L-48 2 L0 -78 L48 2 L104 -48 L92 40 Z"
          fill="url(#gold)" stroke="#6B4A0C" stroke-width="5" stroke-linejoin="round"/>
    <!-- Shine on the left face -->
    <path d="M-80 30 L-88 -24 L-50 12 Z" fill="#FFF6C8" opacity="0.55"/>
    <rect x="-96" y="34" width="192" height="34" rx="9" fill="url(#goldBand)" stroke="#6B4A0C" stroke-width="5"/>
    <circle cx="-104" cy="-48" r="13" fill="url(#gold)" stroke="#6B4A0C" stroke-width="4"/>
    <circle cx="0" cy="-78" r="14" fill="url(#gold)" stroke="#6B4A0C" stroke-width="4"/>
    <circle cx="104" cy="-48" r="13" fill="url(#gold)" stroke="#6B4A0C" stroke-width="4"/>
    <!-- Emeralds on the band -->
    <ellipse cx="0" cy="51" rx="13" ry="10" fill="#2FBF71" stroke="#0B5132" stroke-width="3"/>
    <ellipse cx="-54" cy="51" rx="9" ry="8" fill="#2FBF71" stroke="#0B5132" stroke-width="3"/>
    <ellipse cx="54" cy="51" rx="9" ry="8" fill="#2FBF71" stroke="#0B5132" stroke-width="3"/>
    <circle cx="-4" cy="47" r="3.5" fill="#D6FFE6"/>
  </g>
</svg>
